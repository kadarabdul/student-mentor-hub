<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Student Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f4f7fc;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 8%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .hero {
            padding: 55px 0 35px;
            max-width: 750px;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 44px);
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 17px;
            line-height: 1.7;
            color: #ede9fe;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px 5%;
        }

        .section-title {
            font-size: 25px;
            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .card p {
            color: #64748b;
            line-height: 1.6;
            font-size: 14px;
        }

        .number {
            color: #4f46e5;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .mentor {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #ede9fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .mentor p {
            margin-top: 5px;
            color: #64748b;
            font-size: 14px;
        }

        .progress {
            height: 9px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0 20px;
        }

        .progress-bar {
            height: 100%;
            background: #6366f1;
            border-radius: 10px;
        }

        .session {
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .session:last-child {
            border-bottom: none;
        }

        .session p {
            color: #64748b;
            font-size: 14px;
            margin-top: 7px;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
        }
